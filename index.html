  <title data-i18n="app.title">Pixel Normal Edit</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script>
    (function() {
      var theme = localStorage.getItem('pixel-edit-theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'custom') {
          var bg = localStorage.getItem('pixel-edit-custom-bg');
          var primary = localStorage.getItem('pixel-edit-custom-primary');
          if (bg) document.documentElement.style.setProperty('--custom-bg', bg);
          if (primary) document.documentElement.style.setProperty('--custom-primary', primary);
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
